<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body { margin: 0; background: var(--bg-base); padding: 16px; }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Badge, Card, CardHeader, CardTitle, CardDescription, CardContent, StatusDot, Button, Icon } = window.WorktreeManagerDesignSystem_e60f48;

function Demo() {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
        <Badge>Deployed</Badge>
        <Badge variant="secondary">Worktree</Badge>
        <Badge variant="success">Clean</Badge>
        <Badge variant="warning">391 commits not merged to test</Badge>
        <Badge variant="destructive">Conflict</Badge>
        <Badge variant="outline">Occupied</Badge>
      </div>
      <div style={{ display: 'flex', gap: 16, alignItems: 'center', fontSize: 12, color: 'var(--text-secondary)', fontFamily: 'var(--font-ui)' }}>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}><StatusDot status="success" /> Vault mounted</span>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}><StatusDot status="warning" /> Uncommitted</span>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}><StatusDot status="info" /> Info</span>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}><StatusDot status="sync" /> Syncing</span>
      </div>
      <Card style={{ maxWidth: 420 }}>
        <CardHeader style={{ padding: 16, gap: 8 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <CardTitle style={{ fontSize: 16 }}>worktree-manager</CardTitle>
            <Badge variant="success">Worktree</Badge>
          </div>
          <CardDescription style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13 }}>
            <Icon name="git-branch" size={14} /> main

        </CardHeader>
        <CardContent style={{ padding: 16, paddingTop: 0, display: 'flex', flexDirection: 'column', gap: 10 }}>
          <div style={{ fontSize: 12, color: 'var(--text-secondary)', display: 'flex', gap: 12 }}>
            <span>0 ahead</span><span>0 behind</span><span>0 changed files</span>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
            <Button variant="secondary" size="sm" style={{ fontSize: 12 }}><Icon name="refresh-cw" size={12} /> Sync main</Button>
            <Button variant="secondary" size="sm" style={{ fontSize: 12 }}><Icon name="download" size={12} /> Pull</Button>
            <Button variant="secondary" size="sm" style={{ fontSize: 12 }}><Icon name="upload" size={12} /> Push</Button>
          </div>
        </CardContent>
      </Card>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
