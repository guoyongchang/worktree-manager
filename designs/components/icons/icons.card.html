<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body { margin: 0; background: var(--bg-base); padding: 16px; }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Icon } = window.WorktreeManagerDesignSystem_e60f48;

const NAMES = [
  'git-branch', 'git-merge', 'git-pull-request', 'folder', 'folder-open', 'archive',
  'plus', 'rotate-cw', 'refresh-cw', 'settings', 'terminal', 'briefcase',
  'chevron-right', 'chevron-down', 'chevrons-left', 'chevrons-right', 'chevrons-up-down', 'arrow-left',
  'alert-triangle', 'trash-2', 'x', 'copy', 'check', 'check-circle',
  'file-text', 'file', 'external-link', 'maximize-2', 'minimize-2', 'share-2',
  'square', 'users', 'eye', 'github', 'mic', 'link',
  'qr-code', 'code', 'download', 'upload', 'globe', 'mic-off',
];

function Demo() {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', gap: 4 }}>
      {NAMES.map(n => (
        <div key={n} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '5px 8px', borderRadius: 6, color: 'var(--text-secondary)', fontFamily: 'var(--font-ui)' }}>
          <Icon name={n} size={16} style={{ color: 'var(--text-primary)' }} />
          <span style={{ fontSize: 10, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{n}</span>
        </div>
      ))}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
