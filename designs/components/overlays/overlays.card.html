<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body { margin: 0; background: var(--bg-base); padding: 16px; }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const NS = window.WorktreeManagerDesignSystem_e60f48;
const { DialogHeader, DialogTitle, DialogDescription, DialogFooter, DropdownMenu, DropdownMenuItem, DropdownMenuSeparator, DropdownMenuLabel, Tooltip, Popover, Button, Icon } = NS;

/* Static, in-flow rendition of the Dialog panel (the real Dialog is fixed + overlay) */
function StaticDialog() {
  return (
    <div className="wm-dialog-content" style={{ position: 'static', transform: 'none', width: 400, animation: 'none' }}>
      <DialogHeader>
        <DialogTitle>Switch workspace</DialogTitle>
        <DialogDescription>Switch to workspace "some-projects"? Open terminals stay running.</DialogDescription>
      </DialogHeader>
      <DialogFooter>
        <Button variant="secondary">Cancel</Button>
        <Button>Switch</Button>
      </DialogFooter>
    </div>
  );
}

function Demo() {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start' }}>
        <DropdownMenu
          width="220px"
          trigger={<Button variant="secondary">worktree-manager-space <Icon name="chevron-down" size={14} /></Button>}
        >
          <DropdownMenuItem>some-projects <span className="wm-badge wm-badge--default" style={{ marginLeft: 4 }}>current</span></DropdownMenuItem>
          <DropdownMenuItem>client-work</DropdownMenuItem>
          <DropdownMenuSeparator />
          <DropdownMenuItem style={{ color: 'var(--text-secondary)' }}><Icon name="plus" /> Add workspace</DropdownMenuItem>
        </DropdownMenu>
        <Tooltip content="Refresh worktrees" side="bottom">
          <Button variant="ghost" size="icon"><Icon name="rotate-cw" /></Button>
        </Tooltip>
        <Popover align="start" trigger={<Button variant="secondary" size="sm"><Icon name="share-2" size={12} /> Share</Button>}>
          <div style={{ fontSize: 13, color: 'var(--text-secondary)', width: 220, fontFamily: 'var(--font-ui)' }}>
            Share this workspace over the network with password protection.
          </div>
        </Popover>
        <span style={{ fontSize: 11, color: 'var(--text-muted)', fontFamily: 'var(--font-ui)', alignSelf: 'center' }}>← click / hover these</span>
      </div>
      <StaticDialog />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
