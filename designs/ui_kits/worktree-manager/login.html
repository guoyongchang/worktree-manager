<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Worktree Manager — Browser Login</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body { margin: 0; background: var(--bg-base); color: var(--text-primary); font-family: var(--font-ui); }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/* Port of the browser-mode login screen in src/App.tsx */
const { Button, Input, Icon } = window.WorktreeManagerDesignSystem_e60f48;

function Login() {
  const [password, setPassword] = React.useState('');
  const [verifying, setVerifying] = React.useState(false);
  const [error, setError] = React.useState(null);

  const submit = (e) => {
    e.preventDefault();
    setVerifying(true);
    setError(null);
    setTimeout(() => { setVerifying(false); setError('Incorrect password. Check the share panel on the host machine.'); }, 900);
  };

  return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <div style={{ width: 384, maxWidth: 'calc(100vw - 32px)', display: 'flex', flexDirection: 'column', gap: 16 }}>
        <div style={{ textAlign: 'center', display: 'flex', flexDirection: 'column', gap: 8 }}>
          <div style={{
            width: 40, height: 40, margin: '0 auto 12px', borderRadius: 8,
            background: 'color-mix(in srgb, var(--accent) 20%, transparent)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <Icon name="rotate-cw" size={20} style={{ color: 'var(--accent)' }} />
          </div>
          <h1 style={{ fontSize: 20, fontWeight: 600, margin: 0 }}>Worktree Manager</h1>
          <p style={{ fontSize: 14, color: 'var(--accent)', margin: 0 }}>Workspace: worktree-manager-space</p>
          <p style={{ fontSize: 14, color: 'var(--text-secondary)', margin: 0 }}>Enter the access password to continue</p>
        </div>
        <form onSubmit={submit} style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          <Input type="password" placeholder="Access password" value={password} onChange={e => setPassword(e.target.value)} autoFocus />
          {error && <p style={{ fontSize: 14, color: 'var(--error)', margin: 0 }}>{error}</p>}
          <Button type="submit" disabled={verifying || !password.trim()} style={{ width: '100%' }}>
            {verifying ? 'Verifying…' : 'Enter'}
          </Button>
        </form>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Login />);
</script>
</body>
</html>
