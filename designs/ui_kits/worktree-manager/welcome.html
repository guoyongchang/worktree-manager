<script type="text/babel">

const { Button, Icon } = window.WorktreeManagerDesignSystem_e60f48;

function WelcomeView() {
  const [showDetails, setShowDetails] = React.useState(true);
  return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative' }}>
      <button style={{
        position: 'absolute', top: 16, right: 16, display: 'flex', alignItems: 'center', gap: 6,
        height: 32, padding: '0 10px', fontSize: 12, color: 'var(--text-secondary)',

      <div style={{ maxWidth: 512, width: '100%', margin: '0 auto', textAlign: 'center', padding: 32 }}>
        <div style={{ marginBottom: 32 }}>
          <div className="animate-subtle-pulse" style={{
